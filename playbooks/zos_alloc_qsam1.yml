---
- name: Alloc Qsam files
  hosts: zos
  gather_facts: false
  environment: "{{ environment_vars }}"

  tasks:
    - name: Alloc tst
      zos_data_set:
        name: GAMA02.QSAM.TST
        type: seq
        space_primary: 5
        space_secondary: 5
        space_type: trk	
        record_format: fb
        record_length: 300
        block_size: 6000

